<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffcc00">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ten Ten maison</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; text-align: center;
         min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; }
  input, button { font: inherit; padding: 12px 16px; border-radius: 12px; border: 0; width: 260px; max-width: 100%; }
  .go { background: #ffcc00; color: #111; font-weight: bold; }
  #talk { width: 200px; height: 200px; border-radius: 50%; background: #ffcc00; color: #111; font-size: 22px; font-weight: bold;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #talk.on { background: #ff3b30; color: #fff; transform: scale(1.05); }
  #friends span { display: inline-block; background: #222; padding: 6px 12px; border-radius: 20px; margin: 4px; }
  #friends span.speaking { background: #34c759; color: #111; }
  #status { color: #aaa; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>📻 Ten Ten maison</h1>

<form id="join">
  <p><input id="name" placeholder="Ton pseudo" required maxlength="30"></p>
  <p><input id="group" placeholder="Code du groupe (secret)" required maxlength="30"></p>
  <p><button class="go">Rejoindre</button></p>
</form>

<div id="room" hidden>
  <div id="friends"></div>
  <button id="talk">Maintiens<br>pour parler</button>
  <p style="color:#aaa;font-size:14px">Garde l'appli ouverte, écran allumé, pour entendre tes potes.</p>
  <p><button id="leave">Changer de groupe</button></p>
</div>
<p id="status"></p>

<script>
// Pas de serveur à nous : les messages passent par ntfy.sh, un relais public et gratuit.
// Le code du groupe sert de mot de passe : il devient un nom de canal impossible à deviner.
const RELAY = 'https://ntfy.sh';
const $ = id => document.getElementById(id);
const player = new Audio();
const queue = [];
const myId = Math.random().toString(36).slice(2);
const seen = {};        // pseudo -> dernière fois vu
const got = new Set();  // ids des messages déjà traités (le rattrapage en renvoie certains)
let stream, recorder, chunks = [], me, group, topic, es, lastTs = 0, retry;
let playing = null, waiting = null, watchdog;

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
$('name').value = load('name'); $('group').value = load('group');

async function topicFor(code) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tenten-maison:' + code));
  return 'tenten_' + [...new Uint8Array(hash)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
}
// POST sans Content-Type : requête "simple", pas de pré-vérification CORS.
const post = (meta, body, params = '') =>
  fetch(`${RELAY}/${topic}?message=${encodeURIComponent(JSON.stringify(meta))}${params}`, { method: 'POST', body });

// 0,1 s de vrai silence : sert à débloquer la lecture auto sur iPhone.
function silence() {
  const n = 800, v = new DataView(new ArrayBuffer(44 + n));
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); // PCM, mono
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128); // 128 = silence en 8 bits
  return URL.createObjectURL(new Blob([v], { type: 'audio/wav' }));
}

$('join').onsubmit = async e => {
  e.preventDefault();
  me = $('name').value.trim().slice(0, 30); group = $('group').value.trim().toLowerCase();
  // Ce clic débloque la lecture auto du son (les navigateurs l'exigent) : on lance puis on coupe tout de suite.
  player.src = silence();
  player.play().catch(() => {});
  player.pause();
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { $('status').textContent = 'Il faut autoriser le micro.'; return; }
  store('name', me); store('group', group);
  topic = await topicFor(group);
  $('join').hidden = true; $('room').hidden = false;
  keepAwake();
  connect();
  setInterval(hello, 60000);    // "je suis là", toutes les minutes
  setInterval(renderFriends, 15000);
  renderFriends();
};

$('leave').onclick = () => { es && es.close(); store('group'); location.reload(); };

const hello = () => post({ t: 'hi', n: me, id: myId }, null, '&cache=no').catch(() => {});
// Garde l'écran allumé (sinon le téléphone se verrouille et n'entend plus rien).
const keepAwake = () => navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});

function connect() {
  clearTimeout(retry); es && es.close();
  // since= : au retour (écran rallumé, réseau revenu), on récupère les messages manqués.
  es = new EventSource(`${RELAY}/${topic}/sse` + (lastTs ? '?since=' + lastTs : ''));
  es.onopen = () => { $('status').textContent = 'Connecté au groupe « ' + group + ' »'; hello(); };
  es.onerror = () => { $('status').textContent = 'Reconnexion…'; es.close(); retry = setTimeout(connect, 3000); };
  es.addEventListener('keepalive', e => { try { lastTs = Math.max(lastTs, JSON.parse(e.data).time); } catch {} });
  es.onmessage = e => {
    let m, p;
    try { m = JSON.parse(e.data); p = JSON.parse(m.message); } catch { return; }
    if (m.time) lastTs = Math.max(lastTs, m.time);
    if (m.event !== 'message' || got.has(m.id)) return;
    got.add(m.id);
    if (!p || p.id === myId || typeof p.n !== 'string') return;
    const isNew = !seen[p.n] || Date.now() - seen[p.n] > 150000;
    seen[p.n] = Date.now();
    renderFriends();
    if (p.t === 'hi' && isNew) hello(); // un nouveau arrive : on lui dit qu'on est là
    const fresh = !m.time || Date.now() / 1000 - m.time < 300; // on ne rejoue pas les vieux messages
    if (p.t === 'voice' && fresh && m.attachment && m.attachment.url) {
      queue.push({ from: p.n, audio: m.attachment.url });
      if (!playing && !waiting) playNext();
    }
  };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && topic) { keepAwake(); connect(); } });

function renderFriends() {
  $('friends').innerHTML = '';
  const names = [me + ' (toi)', ...Object.keys(seen).filter(n => Date.now() - seen[n] < 150000)];
  for (const n of names) {
    const s = document.createElement('span');
    s.textContent = n;
    s.dataset.name = n;
    $('friends').append(s);
  }
}

function playNext() {
  clearTimeout(watchdog);
  document.querySelectorAll('#friends .speaking').forEach(s => s.classList.remove('speaking'));
  const clip = playing = queue.shift() || null;
  if (!clip) { $('status').textContent = 'Connecté au groupe « ' + group + ' »'; return; }
  const next = () => { if (playing === clip) playNext(); };
  player.onended = player.onerror = next; // un message illisible ne bloque pas les suivants
  const tag = [...document.querySelectorAll('#friends span')].find(s => s.dataset.name === clip.from);
  tag && tag.classList.add('speaking');
  $('status').textContent = '🔊 ' + clip.from;
  if (navigator.vibrate) navigator.vibrate(80);
  player.src = clip.audio;
  watchdog = setTimeout(() => { if (player.currentTime === 0) next(); }, 15000); // chargement bloqué
  player.play().catch(err => {
    if (playing !== clip) return;
    if (err.name === 'NotAllowedError') { // le téléphone exige un toucher
      clearTimeout(watchdog); waiting = clip; playing = null;
      $('status').textContent = '👆 Touche l\'écran pour entendre ' + clip.from;
      return;
    }
    $('status').textContent = 'Message de ' + clip.from + ' illisible';
    next();
  });
}
// Un toucher n'importe où (sauf le bouton parler) joue le message en attente.
document.addEventListener('pointerdown', e => {
  if (waiting && e.target.id !== 'talk') { queue.unshift(waiting); waiting = null; playNext(); }
});

function start(e) {
  e.preventDefault();
  if (recorder && recorder.state === 'recording') return;
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = d => chunks.push(d.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || 'audio/webm';
    const blob = new Blob(chunks); // sans type exprès : voir post()
    if (blob.size < 1000) { $('status').textContent = 'Trop court, maintiens le bouton'; return; }
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    $('status').textContent = 'Envoi…';
    post({ t: 'voice', n: me, id: myId }, blob, '&filename=voix.' + ext)
      .then(r => $('status').textContent = r.ok ? 'Envoyé ✓' : 'Pas envoyé (' + r.status + ')')
      .catch(() => $('status').textContent = 'Pas envoyé (réseau)');
  };
  recorder.start();
  $('talk').classList.add('on');
  if (navigator.vibrate) navigator.vibrate(30);
}
function stop() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  $('talk').classList.remove('on');
}
$('talk').addEventListener('pointerdown', start);
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('talk').addEventListener(ev, stop));
</script>
</body>
</html>
